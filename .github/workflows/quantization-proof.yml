name: Quantization proofs and examples

on:
  pull_request:
    paths:
      - '_posts/2026-09-05-quantization-unit-tests-proof.md'
      - 'tools/quantization-proof/**'
      - '.github/workflows/quantization-proof.yml'
      - '.github/workflows/pages-deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/quantization-proof/requirements.txt
      - name: Install pinned numerical dependency
        run: python -m pip install -r tools/quantization-proof/requirements.txt
      - name: Set up the pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: tools/quantization-proof
          auto-config: 'false'
          use-mathlib-cache: 'false'
      - name: Fetch only the required Mathlib cache
        working-directory: tools/quantization-proof
        run: |
          lake exe cache get Mathlib.Data.Real.Archimedean Mathlib.Data.Rat.Floor \
            Mathlib.Algebra.Order.Floor.Ring Mathlib.Algebra.BigOperators.Fin \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Linarith \
            Mathlib.Tactic.NormNum Mathlib.Tactic.Ring
      - name: Check proofs, article examples, numerical tests and backend model
        run: python tools/quantization-proof/verify.py --backend
      - name: Confirm dependency revisions stayed locked
        run: git diff --exit-code -- tools/quantization-proof/lake-manifest.json
